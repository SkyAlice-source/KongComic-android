name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0, v1.1.0 等 tag 时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'

      - name: Restore dependencies
        run: |
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          export PUB_HOSTED_URL=https://pub.flutter-io.cn
          flutter pub get --verbose 2>&1

      - name: Setup signing
        run: |
          # 在 CI 上用 keytool 生成临时签名密钥
          # 避免 base64 编解码和文件损坏问题
          keytool -genkey -v -keystore android/kongcomic-release.jks \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -alias kongcomic \
            -storepass kongcomic123 \
            -keypass kongcomic123 \
            -dname "CN=KongComic, OU=KongComic, O=KongComic, L=Unknown, ST=Unknown, C=CN" \
            2>/dev/null
          cat > android/key.properties << PROPEOF
          storePassword=kongcomic123
          keyPassword=kongcomic123
          keyAlias=kongcomic
          storeFile=../kongcomic-release.jks
          PROPEOF
          echo "Signing configured (CI-generated keystore)"

      - name: Build release APKs
        run: |
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          export PUB_HOSTED_URL=https://pub.flutter-io.cn
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build universal APK
        run: |
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          export PUB_HOSTED_URL=https://pub.flutter-io.cn
          flutter build apk --release --android-skip-build-dependency-validation

      # 重命名 APK
      - name: Rename APKs
        run: |
          VERSION=$(grep 'flutter.versionName' android/local.properties | cut -d'=' -f2)
          mkdir -p release-artifacts
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-artifacts/KongComic-${VERSION}-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-artifacts/KongComic-${VERSION}-armeabi-v7a.apk"
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk "release-artifacts/KongComic-${VERSION}-x86_64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "release-artifacts/KongComic-${VERSION}-universal.apk"

      # 上传到 GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-artifacts/*
          generate_release_notes: true

      # 如果 Release 上传失败，作为 artifact 保存
      - name: Upload APKs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KongComic-APKs
          path: release-artifacts/*
