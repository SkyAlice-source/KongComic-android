name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0, v1.1.0 等 tag 时触发
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: 'Git tag to build (e.g. v1.2.26)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Restore dependencies
        run: |
          flutter pub get --verbose 2>&1

      # 缓存 Gradle 构建输出，加速后续构建
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup signing
        run: |
          # 从 GitHub Secrets 还原密钥库（确保证书一致，支持应用更新）
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # 写入 base64 并清理空白字符（防止 GitHub Secrets 换行问题）
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r\t ' > /tmp/keystore.b64
            base64 -d /tmp/keystore.b64 > android/kongcomic-release.jks 2>/dev/null
            # 验证文件是否有效（JKS 至少约 2.5KB）
            JKS_SIZE=$(wc -c < android/kongcomic-release.jks 2>/dev/null || echo 0)
            if [ "$JKS_SIZE" -gt 2000 ]; then
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
              echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
              echo "storeFile=../kongcomic-release.jks" >> android/key.properties
              echo "Signing configured from secrets (${JKS_SIZE} bytes)"
            else
              echo "Warning: Keystore file invalid (${JKS_SIZE} bytes), building without signing"
              rm -f android/kongcomic-release.jks android/key.properties 2>/dev/null
            fi
          else
            echo "Warning: No signing secrets configured, building without signature"
          fi

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Build universal APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      # 重命名 APK
      - name: Rename APKs
        run: |
          # 从 pubspec.yaml 读取版本号（更可靠，不依赖 local.properties）
          VERSION=$(grep -E '^version: ' pubspec.yaml | sed 's/version: *//' | sed 's/\+.*$//')
          echo "Extracted version: $VERSION"
          APK_DIR="build/app/outputs/flutter-apk"
          mkdir -p release-artifacts
          # 列出构建产物用于调试
          echo "=== Build outputs ==="
          ls -lh "$APK_DIR" 2>/dev/null || echo "Directory not found"
          echo "===================="
          # 移动 split APKs（默认 Flutter 命名）
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="$APK_DIR/app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              mv "$SRC" "release-artifacts/KongComic-${VERSION}-${ABI}.apk"
              echo "Moved: $ABI"
            else
              echo "Warning: $ABI APK not found at $SRC"
            fi
          done
          # 移动 universal APK
          SRC="$APK_DIR/app-release.apk"
          if [ -f "$SRC" ]; then
            mv "$SRC" "release-artifacts/KongComic-${VERSION}-universal.apk"
            echo "Moved: universal"
          else
            echo "Warning: universal APK not found at $SRC (may be inside split-per-abi build)"
          fi

      # 准备三语更新日志：仓库约定 changelogs/v<version>.md（带 v 前缀），
      # 而 pubspec 提取的 VERSION 不带 v。优先复制带 v 的源文件为不带 v 的
      # 临时文件供 body_path 使用；找不到才生成占位，确保 release body
      # 永不退化成空/纯链接。
      - name: Prepare release notes
        run: |
          VERSION=$(grep -E '^version: ' pubspec.yaml | sed 's/version: *//' | sed 's/\+.*$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p changelogs
          if [ -f "changelogs/v${VERSION}.md" ]; then
            cp "changelogs/v${VERSION}.md" "changelogs/${VERSION}.md"
          elif [ ! -f "changelogs/${VERSION}.md" ]; then
            echo "Release $VERSION" > "changelogs/${VERSION}.md"
          fi
          echo "Release notes for $VERSION ready"

      # 上传到 GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: release-artifacts/*
          body_path: changelogs/${{ env.VERSION }}.md

      # 如果 Release 上传失败，作为 artifact 保存
      - name: Upload APKs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KongComic-APKs
          path: release-artifacts/*
